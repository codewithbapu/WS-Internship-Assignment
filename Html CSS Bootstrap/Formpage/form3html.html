<!DOCTYPE html>
<html>
<head>
    <title>Registration Forms</title>
    <link rel="stylesheet" href="form3css.css">
</head>
<body>

    <!-- First Registration Form -->
    <div class="small-form">
        <h2>Registration</h2>

        <div class="options">
            <span>🔵 Personal</span>
            <span>🔵 Company</span>
        </div>

        <div class="input-box">
            <span>✉</span>
            <input type="email" placeholder="Email">
        </div>

        <div class="input-box">
            <span>♟</span>
            <input type="text" placeholder="Name">
        </div>

        <div class="input-box">
            <span>♜</span>
            <input type="password" placeholder="Password">
        </div>

        <div class="gender">
            <label><input type="radio" name="gender"> Male</label>
            <label><input type="radio" name="gender"> Female</label>
        </div>

        <div class="bottom">
            <p>By clicking Register, you agree on our
                <a href="#">terms and condition</a>.
            </p>
            <button>Register</button>
        </div>
    </div>


    <!-- Second Registration Form -->
    <div class="big-form">

        <div class="welcome">
            <h2>Welcome Back!</h2>
            <p>Provide your personal details to use all features</p>
            <button class="sign-in">SIGN IN</button>
        </div>

        <div class="register">
            <h2>Register With</h2>

            <div class="social">
                <button>G+</button>
                <button>f</button>
                <button>◉</button>
                <button>in</button>
            </div>

            <h2>OR</h2>
            <p>Fill Out The Following Info For Registration</p>

            <form>
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">

                <button class="sign-up" type="submit">SIGN UP</button>
            </form>
        </div>

    </div>

</body>
</html>
