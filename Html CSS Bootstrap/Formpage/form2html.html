
<!DOCTYPE html>
<html>
<head>
    <title>Assignment 2</title>
    <link rel="stylesheet" href="form2css.css">
</head>
<body>

    <div class="instagram">

        <div class="left">
            <div class="logo">◎</div>

            <h2>See everyday moments from</h2>
            <h2>your <span>close friends.</span></h2>

            <div class="photos">
                <div class="photo p1">📸</div>
                <div class="photo p2">🌸</div>
                <div class="photo p3">❤️</div>
            </div>

            <small>App Store</small>
        </div>

        <div class="right">
            <p>Log into Instagram</p>

            <input type="text" placeholder="Mobile number, username or email">
            <input type="password" placeholder="Password">

            <button class="login">Log in</button>

            <p class="forgot">Forgot password?</p>

            <button class="facebook">f &nbsp; Log in with Facebook</button>
            <button class="create">Create new account</button>
        </div>

    </div>

    <div class="registration">

        <div class="form-box">
            <h3>Registration</h3>

            <h4>Personal Details</h4>

            <div class="form-grid">
                <div>
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="text" placeholder="Enter birth date">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div>
                    <label>Mobile number</label>
                    <input type="text" placeholder="Enter mobile number">
                </div>

                <div>
                    <label>Gender</label>
                    <input type="text" placeholder="Enter your gender">
                </div>

                <div>
                    <label>Occupation</label>
                    <input type="text" placeholder="Enter occupation">
                </div>
            </div>

            <h4>Identity Details</h4>

            <div class="form-grid">
                <div>
                    <label>ID Type</label>
                    <input type="text" placeholder="Enter ID type">
                </div>

                <div>
                    <label>ID Number</label>
                    <input type="text" placeholder="Enter ID number">
                </div>

                <div>
                    <label>Issue Authority</label>
                    <input type="text" placeholder="Enter issue department">
                </div>

                <div>
                    <label>Issue Date</label>
                    <input type="text" placeholder="Enter ID issue date">
                </div>

                <div>
                    <label>Issue State</label>
                    <input type="text" placeholder="Enter ID issue state">
                </div>

                <div>
                    <label>Expiry Date</label>
                    <input type="text" placeholder="Enter ID expiry date">
                </div>
            </div>

            <button class="next">Next →</button>
        </div>

    </div>

</body>
</html>
